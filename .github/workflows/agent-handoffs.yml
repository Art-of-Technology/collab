name: Agent handoffs
on:
  pull_request:
    paths: ['src/lib/agent-handoff*', 'src/lib/agent-review*', 'src/lib/project-coordinator.ts', 'src/lib/agent-label-triggers.ts', 'src/lib/issue-mutation.ts', 'src/lib/prisma.ts', 'src/lib/database-diagnostics.ts', 'src/app/api/issues/**', 'src/app/api/apps/auth/issues/**', 'src/lib/issue-finder.ts', 'src/lib/apps/auth-middleware.ts', 'src/lib/oauth-scopes.ts', 'src/app/api/apps/auth/agents/**', 'packages/cli/**', 'prisma/**', 'tests/agents/**', 'tests/integration/agent-review-guard-db.test.cjs', 'tests/integration/issue-activity-scope.test.cjs', 'tests/security/helpers.cjs', 'tests/security/bootstrap-*.test.cjs', 'scripts/bootstrap-empty-database.mjs', 'package.json', 'package-lock.json', '.github/workflows/agent-handoffs.yml']
  push:
    branches: [main]
    paths: ['src/lib/agent-handoff*', 'src/lib/agent-review*', 'src/lib/project-coordinator.ts', 'src/lib/agent-label-triggers.ts', 'src/lib/issue-mutation.ts', 'src/lib/prisma.ts', 'src/lib/database-diagnostics.ts', 'src/app/api/issues/**', 'src/app/api/apps/auth/issues/**', 'src/lib/issue-finder.ts', 'src/lib/apps/auth-middleware.ts', 'src/lib/oauth-scopes.ts', 'src/app/api/apps/auth/agents/**', 'packages/cli/**', 'prisma/**', 'tests/agents/**', 'tests/integration/agent-review-guard-db.test.cjs', 'tests/integration/issue-activity-scope.test.cjs', 'tests/security/helpers.cjs', 'tests/security/bootstrap-*.test.cjs', 'scripts/bootstrap-empty-database.mjs', 'package.json', 'package-lock.json', '.github/workflows/agent-handoffs.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: collab
          POSTGRES_PASSWORD: collab
          POSTGRES_DB: collab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - name: Install local PostgreSQL test binaries
        run: sudo apt-get update && sudo apt-get install -y postgresql
      - run: node --test --test-concurrency=1 tests/agents/*.test.cjs tests/integration/issue-activity-scope.test.cjs
      - name: Apply review guard migration to an isolated database
        env:
          DATABASE_URL: postgresql://collab:collab@localhost:5432/collab_test
        run: |
          npx prisma db push --skip-generate
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c 'DROP TABLE "AgentReviewRequest", "AgentTransferOffer" CASCADE'
          for migration in \
            20261030000200_agent_transfer_offer \
            20261031000100_transfer_worker_guard \
            20261031000200_transfer_recipient_guard \
            20261031000300_pending_offer_serialization \
            20261107000100_agent_review_guard; do
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f "prisma/migrations/$migration/migration.sql"
          done
      - name: Test review guards against PostgreSQL
        env:
          COLLAB_REVIEW_GUARD_TEST_DATABASE_URL: postgresql://collab:collab@localhost:5432/collab_test
          COLLAB_REQUIRE_REVIEW_GUARD_DB: '1'
        run: node --test --test-concurrency=1 tests/integration/agent-review-guard-db.test.cjs
      - name: Test a fresh database bootstrap and review guards
        env:
          COLLAB_BOOTSTRAP_TEST_SERVER_URL: postgresql://collab:collab@127.0.0.1:5432/collab_test?sslmode=disable
        run: node --test tests/security/bootstrap-recipe.test.cjs tests/security/bootstrap-empty-database.test.cjs
