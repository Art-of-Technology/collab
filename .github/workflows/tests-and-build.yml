name: Tests and build
# The other workflows run a few test files for the paths they watch. This one runs for every change:
# the whole security and render suites, the type check, lint, and the production build.
# A pull request that changes only documentation (scripts/docs-only.mjs) runs only the docs check.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  changes:
    name: changed files
    # Pushes to main always run everything: the release waits for full tests and production build to pass there.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.docs-only.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request's merge commit and its first parent, the base branch.
          fetch-depth: 2
      - id: docs-only
        run: echo "docs-only=$(git diff --name-only --no-renames HEAD^1 HEAD | node scripts/docs-only.mjs)" >> "$GITHUB_OUTPUT"
  full-tests:
    name: full tests
    needs: changes
    # Runs when the changes job was skipped (a push) or failed: only a docs-only answer skips it.
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - name: Install local PostgreSQL test binaries
        run: sudo apt-get update && sudo apt-get install -y postgresql
      - name: Type check
        run: npx tsc --noEmit -p .
      - name: Security and render tests, compared with tests/known-failures.txt
        run: npm test
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps --only-shell chromium
      - name: Browser tests
        run: npm run test:browser
  lint:
    name: lint
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOCS_ONLY: ${{ needs.changes.outputs.docs-only == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ${{ env.DOCS_ONLY != 'true' && 'npm' || '' }}
      - if: env.DOCS_ONLY != 'true'
        run: npm ci --legacy-peer-deps
      # The docs check needs only these three packages, at the versions in the lock file.
      - if: env.DOCS_ONLY == 'true'
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/docs" $(node -p "['typescript', 'marked', 'entities'].map(name => name + '@' + require('./package-lock.json').packages['node_modules/' + name].version).join(' ')")
          mv "$RUNNER_TEMP/docs/node_modules" node_modules
      # Errors fail the check. Warnings do not: main had 56 of them when this was added.
      - if: env.DOCS_ONLY != 'true'
        run: npm run lint
      # The published docs: no dead link or missing heading, every page in the navigation, every `collab` command real,
      # and the two generated reference pages in step with the code (`npm run docs:reference` rewrites them).
      - run: npm run docs:check
  production-build:
    name: production build
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      # The release builder gives the build a 3072 MB heap. A change that needs more fails here
      # instead of at release time. Do not raise this number to make a change fit.
      - name: Build with the release builder's heap limit
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_APP_URL: https://collab.weez.boo
          NODE_OPTIONS: --max-old-space-size=3072
        run: node node_modules/next/dist/bin/next build --webpack
      # The docs are public and are read from files the standalone output must carry. Start the built
      # server the way production runs it and fetch them without signing in.
      - name: Public docs answer on the built server
        env:
          # Not a secret: the server refuses every page without a value here, and this step never signs in.
          NEXTAUTH_SECRET: docs-check
          NEXTAUTH_URL: http://127.0.0.1:3999
        run: |
          PORT=3999 HOSTNAME=127.0.0.1 node .next/standalone/server.js &
          for attempt in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3999/docs && break; sleep 1; done
          for address in /docs /docs/cli /docs/reference/cli-commands /docs/reference/mcp-tools /llms.txt /llms-full.txt /docs-index.json; do
            status=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3999$address")
            [ "$status" = 200 ] || { echo "$address answered $status, not 200"; exit 1; }
          done
          curl -sf http://127.0.0.1:3999/docs/index.md | cmp - content/docs/index.md
          curl -sf http://127.0.0.1:3999/docs.md | cmp - content/docs/index.md
          curl -sf http://127.0.0.1:3999/docs/cli.md | cmp - content/docs/cli.md
          # The search box on every docs page reads this file; a hit's address must be a heading that is on the page.
          curl -sf http://127.0.0.1:3999/docs-index.json | grep -q '"id":"/docs/cli#agents"' || { echo "/docs-index.json has no entry for /docs/cli#agents"; exit 1; }
          # Links elsewhere in the app and on other sites point at these headings of the CLI page.
          curl -sf http://127.0.0.1:3999/docs/cli > docs-cli.html
          for id in installation authentication workflow agents commands; do
            grep -q "id=\"$id\"" docs-cli.html || { echo "/docs/cli has no heading with the id $id"; exit 1; }
          done
