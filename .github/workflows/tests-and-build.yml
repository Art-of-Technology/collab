name: Tests and build
# The other workflows run a few test files for the paths they watch. This one runs for every change:
# the whole security and render suites, the type check, lint, and the production build.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  full-tests:
    name: full tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - name: Install local PostgreSQL test binaries
        run: sudo apt-get update && sudo apt-get install -y postgresql
      - name: Type check
        run: npx tsc --noEmit -p .
      - name: Security and render tests, compared with tests/known-failures.txt
        run: npm test
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      # Errors fail the check. Warnings do not: main had 56 of them when this was added.
      - run: npm run lint
  production-build:
    name: production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      # The release builder gives the build a 3072 MB heap. A change that needs more fails here
      # instead of at release time. Do not raise this number to make a change fit.
      - name: Build with the release builder's heap limit
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_APP_URL: https://collab.weez.boo
          NODE_OPTIONS: --max-old-space-size=3072
        run: node node_modules/next/dist/bin/next build --webpack
      # The docs are public and are read from files the standalone output must carry. Start the built
      # server the way production runs it and fetch them without signing in.
      - name: Public docs answer on the built server
        env:
          # Not a secret: the server refuses every page without a value here, and this step never signs in.
          NEXTAUTH_SECRET: docs-check
          NEXTAUTH_URL: http://127.0.0.1:3999
        run: |
          PORT=3999 HOSTNAME=127.0.0.1 node .next/standalone/server.js &
          for attempt in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3999/docs && break; sleep 1; done
          for address in /docs /docs/cli /llms.txt /llms-full.txt; do
            status=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3999$address")
            [ "$status" = 200 ] || { echo "$address answered $status, not 200"; exit 1; }
          done
          curl -sf http://127.0.0.1:3999/docs/index.md | cmp - content/docs/index.md
          curl -sf http://127.0.0.1:3999/docs.md | cmp - content/docs/index.md
