name: Collab CLI native downloads

on:
  pull_request:
    paths: ['packages/cli/**', 'public/install.sh', 'public/install.ps1', '.github/workflows/cli-native.yml']
  push:
    tags: ['cli-v*']

permissions:
  contents: read

jobs:
  build:
    name: Native CLI (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
            target: bun-darwin-arm64
          - platform: darwin-x64
            runner: macos-15-intel
            target: bun-darwin-x64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: bun-linux-arm64
          - platform: linux-x64
            runner: ubuntu-24.04
            target: bun-linux-x64-baseline
          - platform: windows-x64
            runner: windows-2022
            target: bun-windows-x64-baseline
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.13'
      - name: Build standalone CLI
        env:
          # Bun moves extracted targets from the checkout into its cache; keep both on the same drive.
          BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.bun-cache
        run: |
          suffix=''
          if [ "$RUNNER_OS" = Windows ]; then suffix='.exe'; fi
          npm run build:native --prefix packages/cli -- --target=${{ matrix.target }} --outfile="dist/collab$suffix"
      - name: Package download and checksum
        env:
          PLATFORM: ${{ matrix.platform }}
          COPYFILE_DISABLE: '1'
        run: |
          mkdir -p downloads "stage/collab-$PLATFORM"
          cp packages/cli/README.md packages/cli/LICENSE.txt "stage/collab-$PLATFORM/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp packages/cli/dist/collab.exe "stage/collab-$PLATFORM/"
          else
            cp packages/cli/dist/collab "stage/collab-$PLATFORM/"
          fi
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/oven-sh/bun/bun-v1.3.13/LICENSE.md -o "stage/collab-$PLATFORM/BUN-LICENSE.md"
          if [ "$RUNNER_OS" = Windows ]; then
            # PowerShell 7 writes slash-separated ZIP entries required by the installer.
            # shellcheck disable=SC2016 # PowerShell expands its own environment variables.
            pwsh -NoProfile -Command 'Compress-Archive -Path "stage/collab-$env:PLATFORM" -DestinationPath "downloads/collab-$env:PLATFORM.zip"'
          else
            tar -czf "downloads/collab-$PLATFORM.tar.gz" -C stage "collab-$PLATFORM"
          fi
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const name = `collab-${process.env.PLATFORM}.${process.platform === 'win32' ? 'zip' : 'tar.gz'}`;
          const hash = createHash('sha256').update(readFileSync(`downloads/${name}`)).digest('hex');
          writeFileSync(`downloads/${name}.sha256`, `${hash}  ${name}\n`);
          JS
      - name: Verify and extract the download
        if: runner.os != 'Windows'
        working-directory: downloads
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          shasum -a 256 --check "collab-$PLATFORM.tar.gz.sha256"
          tar -xzf "collab-$PLATFORM.tar.gz"
      - name: Test the packaged native executable
        if: runner.os != 'Windows'
        run: node --test packages/cli/test/cli.test.mjs
        env:
          COLLAB_CLI_EXECUTABLE: ${{ github.workspace }}/downloads/collab-${{ matrix.platform }}/collab
      - name: Test one-command Unix installation
        if: runner.os != 'Windows'
        run: node --test packages/cli/test/installer.test.mjs
        env:
          COLLAB_NATIVE_DOWNLOADS: ${{ github.workspace }}/downloads
      - name: Test one-command Windows installation and installed CLI
        if: runner.os == 'Windows'
        shell: powershell
        run: ./packages/cli/test/installer.windows.ps1
        env:
          COLLAB_NATIVE_DOWNLOADS: ${{ github.workspace }}/downloads
      - uses: actions/upload-artifact@v4
        with:
          name: collab-${{ matrix.platform }}
          path: |
            downloads/*.tar.gz
            downloads/*.zip
            downloads/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/cli-v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: collab-*
          merge-multiple: true
          path: downloads
      - name: Verify release version and all downloads
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node <<'JS'
          const p = require('./packages/cli/package.json');
          if (process.env.GITHUB_REF_NAME !== `cli-v${p.version}`) process.exit(1);
          JS
          cp public/install.sh public/install.ps1 downloads/
          cd downloads
          sha256sum install.sh > install.sh.sha256
          sha256sum install.ps1 > install.ps1.sha256
          for platform in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            sha256sum --check "collab-$platform.tar.gz.sha256"
          done
          sha256sum --check collab-windows-x64.zip.sha256
          sha256sum --check install.sh.sha256 install.ps1.sha256
      - name: Publish CLI release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'NOTES'
          Standalone Collab CLI for macOS (Apple Silicon and Intel) and Linux (ARM64 and x64). No Node.js or Bun installation required. Also includes a native Windows x64 executable.

          One-command installation (macOS/Linux):
          ```sh
          ZDOTDIR="${ZDOTDIR:-$HOME}" bash -o pipefail -c 'curl -fsSL https://collab.weez.boo/install.sh | sh' && . "$HOME/.local/share/collab/env"
          ```
          Windows PowerShell:
          ```powershell
          irm https://collab.weez.boo/install.ps1 | iex
          ```
          The installer verifies SHA-256 and configures PATH immediately and for future terminals. Scripts and archives with SHA-256 sidecars are attached. Instructions: https://collab.weez.boo/docs#installation

          These downloads do not carry a verified publisher signature. The macOS builds are not notarized. Windows ARM64 and Alpine/musl builds are not included. Windows credentials use private owner ACLs; Unix 0700/0600 checks remain enforced.

          Each executable passed the CLI integration tests on its matching OS and architecture. Tests use synthetic local servers; they are not production or browser acceptance.
          NOTES
          gh release create "$GITHUB_REF_NAME" downloads/* --verify-tag --latest=false --title "Collab CLI ${GITHUB_REF_NAME#cli-v}" --notes-file release-notes.md
