name: Collab CLI native downloads

on:
  pull_request:
    paths: ['packages/cli/**', '.github/workflows/cli-native.yml']
  push:
    tags: ['cli-v*']

permissions:
  contents: read

jobs:
  build:
    name: Native CLI (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
            target: bun-darwin-arm64
          - platform: darwin-x64
            runner: macos-15-intel
            target: bun-darwin-x64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: bun-linux-arm64
          - platform: linux-x64
            runner: ubuntu-24.04
            target: bun-linux-x64-baseline
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.13'
      - name: Build standalone CLI
        run: npm run build:native --prefix packages/cli -- --target=${{ matrix.target }}
      - name: Package download and checksum
        env:
          PLATFORM: ${{ matrix.platform }}
          COPYFILE_DISABLE: '1'
        run: |
          mkdir -p downloads "stage/collab-$PLATFORM"
          cp packages/cli/dist/collab packages/cli/README.md packages/cli/LICENSE.txt "stage/collab-$PLATFORM/"
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/oven-sh/bun/bun-v1.3.13/LICENSE.md -o "stage/collab-$PLATFORM/BUN-LICENSE.md"
          tar -czf "downloads/collab-$PLATFORM.tar.gz" -C stage "collab-$PLATFORM"
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const name = `collab-${process.env.PLATFORM}.tar.gz`;
          const hash = createHash('sha256').update(readFileSync(`downloads/${name}`)).digest('hex');
          writeFileSync(`downloads/${name}.sha256`, `${hash}  ${name}\n`);
          JS
      - name: Verify and extract the download
        working-directory: downloads
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          shasum -a 256 --check "collab-$PLATFORM.tar.gz.sha256"
          tar -xzf "collab-$PLATFORM.tar.gz"
      - name: Test the packaged native executable
        run: node --test packages/cli/test/cli.test.mjs
        env:
          COLLAB_CLI_EXECUTABLE: ${{ github.workspace }}/downloads/collab-${{ matrix.platform }}/collab
      - uses: actions/upload-artifact@v4
        with:
          name: collab-${{ matrix.platform }}
          path: |
            downloads/*.tar.gz
            downloads/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/cli-v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: collab-*
          merge-multiple: true
          path: downloads
      - name: Verify release version and all downloads
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node <<'JS'
          const p = require('./packages/cli/package.json');
          if (process.env.GITHUB_REF_NAME !== `cli-v${p.version}`) process.exit(1);
          JS
          cd downloads
          for platform in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            sha256sum --check "collab-$platform.tar.gz.sha256"
          done
      - name: Publish CLI release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'NOTES'
          Standalone Collab CLI for macOS (Apple Silicon and Intel) and Linux (ARM64 and x64). No Node.js or Bun installation required. Windows users can use the Linux build in WSL.

          Download the archive for your machine and its `.sha256` file. Verify the checksum before extracting. Installation instructions and commands: https://collab.weez.boo/docs#installation

          These binaries are not Apple notarized. Native Windows and Alpine/musl builds are not included. The existing CLI login and credential protections are unchanged.

          Each executable passed the CLI integration tests on its matching OS and architecture. Tests use synthetic local servers; they are not production or browser acceptance.
          NOTES
          gh release create "$GITHUB_REF_NAME" downloads/* --verify-tag --latest=false --title "Collab CLI ${GITHUB_REF_NAME#cli-v}" --notes-file release-notes.md
